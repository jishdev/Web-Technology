$kind: http-request
url: "{{baseUrl}}/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"event":"Hackathon","name":"Test User","email":"test@example.com","phone":"9876543210","year":"S7 — Final Year","dept":"CSE","inst":"MBCET","team":"Test Team"}'
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { pm.collectionVariables.set('registrationId', pm.response.json()._id); }
order: 3000
