# docker compose up --build
# Starts MongoDB + the API, seeds initial content (safe to repeat), then serves on :5000.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hash27
      # Put real values in a .env file next to this compose file
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173}
    volumes:
      - uploads:/app/uploads
    command: ["sh", "-c", "node scripts/seed.js && node src/server.js"]

volumes:
  mongo-data:
  uploads:
